<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>midnight synth</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background">
      <span class="top">midnight synth</span
      ><span class="bottom">midnight synth</span>
    </div>
    <main class="synth">
      <section class="module lead">
        <h2>(lead)</h2>
        <div class="label">STYLE</div>
        <div class="styles" data-group="lead">
          <button class="active" data-style="dark">DARK</button
          ><button data-style="club">CLUB</button
          ><button data-style="rave">RAVE</button>
        </div>
        <div class="label"><span>LEVEL</span><span id="leadNum">24</span></div>
        <input
          class="slider"
          id="leadLevel"
          aria-label="Lead volume"
          type="range"
          min="0"
          max="100"
          value="24"
        />
        <p class="hint">SHORT RAVE STABS</p>
      </section>
      <section class="module bass">
        <h2>(bass)</h2>
        <div class="label">STYLE</div>
        <div class="styles" data-group="bass">
          <button data-style="deep">DEEP</button
          ><button class="active" data-style="hard">HARD</button
          ><button data-style="rave">RAVE</button>
        </div>
        <div class="label"><span>LEVEL</span><span id="bassNum">75</span></div>
        <input
          class="slider"
          id="bassLevel"
          aria-label="Bass volume"
          type="range"
          min="0"
          max="100"
          value="75"
        />
        <p class="hint">HEAVY UNDERGROUND BASS</p>
      </section>
      <section class="module drums">
        <h2>(drums)</h2>
        <div class="label">PARTS · ON / OFF</div>
        <div class="toggles">
          <button class="toggle active" data-drum="kick" aria-pressed="true">
            KICK <small>ON</small></button
          ><button class="toggle active" data-drum="clap" aria-pressed="true">
            CLAP <small>ON</small></button
          ><button class="toggle active" data-drum="hat" aria-pressed="true">
            HATS <small>ON</small></button
          ><button class="toggle" data-drum="metal" aria-pressed="false">
            METAL <small>OFF</small>
          </button>
        </div>
        <div class="label"><span>LEVEL</span><span id="drumNum">75</span></div>
        <input
          class="slider"
          id="drumLevel"
          aria-label="Drums volume"
          type="range"
          min="0"
          max="100"
          value="75"
        />
        <p class="hint">HARD CLUB RHYTHMS</p>
        <div class="drum-disc" aria-label="Rotating techno word"><span class="drum-disc-word">TECHNO</span></div>
      </section>
      <section class="module fx">
        <h2>(fx)</h2>
        <div class="toggles">
          <button class="toggle active" data-fx="rumble" aria-pressed="true">
            RUMBLE <small>ON</small></button
          ><button
            class="toggle active"
            data-fx="distortion"
            aria-pressed="true"
          >
            DISTORTION <small>ON</small></button
          ><button
            class="toggle active"
            data-fx="atmosphere"
            aria-pressed="true"
          >
            DARK ATMOS <small>ON</small></button
          ><button class="toggle" data-fx="echo" aria-pressed="false">
            ECHO <small>OFF</small>
          </button>
        </div>
        <p class="hint">DARK CLUB EFFECTS</p>
      </section>
      <section class="module output">
        <div>
          <h2>(output)</h2>
          <div class="meter" id="meter">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
        </div>
        <div>
          <div class="info">
            <span>STEREO<br />MASTER</span><span class="bpm">128 BPM</span>
          </div>
          <p class="status" id="status">READY</p>
          <div class="transport">
            <button id="play">PLAY</button><button id="stop">STOP</button>
          </div>
        </div>
      </section>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
